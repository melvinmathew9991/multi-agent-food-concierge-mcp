# Is there anything on the menu for this query? Labels for calibrating the weak-match signal (#143).
#
# on_menu: true when the menu has a dish a reasonable diner would accept as what they asked for; false when it has
# nothing of the kind (a dish it doesn't serve, a request that isn't for food, nonsense). Near misses are the hard
# part: "spaghetti carbonara" is off the menu although Spaghetti Aglio Olio is on it, since the diner named a dish.
# Requests vague enough that several dishes fit ("something sweet after dinner") are on the menu.
#
# group: named (a dish on the menu, as diners say it), category (a kind of dish or an ingredient), vague (an
# occasion or a mood), near_miss (food the menu doesn't serve), off_topic (not a food request: tasks, injections,
# nonsense).
#
# seen: true for queries that shaped the signal before this set existed (the 2026-10-26 probes and #143's
# examples); they always go to the dev split. Every other query is split half and half within its group by the
# SHA-256 of its text (food_concierge.evaluation.weak_match), so the split can't be chosen by hand.
#
# Written by the developer against the 144 dish names, before any signal was scored on it. Scored by
# `python scripts/weak_match_report.py`.

  # Avoided, but the menu doesn't record it: the note names it, nothing is applied
  - {text: "no onion no garlic", unsupported: [onion, garlic]}
  - {text: "without onion", unsupported: [onion]}
  - {text: "hold the onions", unsupported: [onion]}
  - {text: "no garlic please", unsupported: [garlic]}

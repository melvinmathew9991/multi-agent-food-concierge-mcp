# Allergen ingredient lexicon (Phase 2, item 4). Reviewed by the owner; bump `version` on every change.
#
# Each term is matched as a whole word, case-insensitively, with an optional plural "s", or "es" after a vowel or s,
# x, z, ch or sh ("til" must not match "tiles"). At each position the longest known phrase wins, so "peanut butter"
# is peanuts (not milk) and "makki atta" is neutral (not wheat).
# A term listed under several allergens maps to all of them. Wheat implies gluten, which is added automatically.
#
# - allergens: terms whose presence means the dish contains that allergen (level "contains").
# - neutral: terms that carry no allergen, including phrases that look like one but aren't ("coconut milk").
# - opaque: composite ingredients whose recipe can't be seen; a dish listing one is "unverified". A term may also
#   appear under allergens, when its usual recipe is known to contain something (farsan: peanuts).
#
# The lexicon is closed-world: every word of every ingredient must be covered by some term above or below. A word
# it doesn't know fails the catalog build, and makes a dish unverified wherever it is tagged outside the build, so
# a new ingredient ("custard", "sev") can't slip through as allergen-free. Add it under the allergens it carries,
# to neutral, or to opaque when its recipe can't be seen.
#
# Negations such as "dairy-free" or "eggless" are deliberately not understood: for safety, a false alarm beats a miss.
# Recipe assumptions for composite ingredients are recorded in data/raw/README.md.


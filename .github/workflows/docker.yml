name: docker

# Builds the server image, starts it and runs the deploy smoke test against it, then again with no network at all.
# Not on every PR: the build downloads the embedding model and takes a few minutes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - data/photos/**
      - requirements.lock
      - requirements-dev.lock
      - scripts/smoke_deploy.py
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t food-concierge:ci .
      - name: Size
        run: docker image ls food-concierge:ci --format '{{.Size}}'
      - name: Start, with a throwaway agent token
        run: |
          token=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$token"
          echo "SMOKE_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name app -p 7860:7860 -e API_TOKEN_AGENT="$token"             -e ALLOWED_HOSTS=127.0.0.1:7860,localhost:7860 food-concierge:ci
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:7860/ready > /dev/null; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs app; exit 1
      - name: Smoke test (no model calls)
        # Runs in the image itself, so the runner needs no Python packages.
        run: |
          docker run --rm --network host -e SMOKE_TOKEN -v "$PWD/scripts:/scripts:ro" food-concierge:ci \
            python /scripts/smoke_deploy.py http://127.0.0.1:7860 --token-env SMOKE_TOKEN
      - name: Runs as non-root, offline model files, read-only code and data, no pip
        run: |
          test "$(docker exec app id -u)" = "1000"
          docker exec app python -c "import os; assert os.environ['HF_HUB_OFFLINE'] == '1'"
          docker exec app sh -c 'for d in /app /app/src /app/data /app/cache; do test ! -w "$d" || exit 1; done'
          if docker exec app python -m pip --version; then echo "pip is still in the image"; exit 1; fi
      - name: Smoke test with no network and a read-only filesystem
        run: |
          docker run -d --name offline --network none --read-only --tmpfs /tmp \
            -e ALLOWED_HOSTS=127.0.0.1:7860,localhost:7860 food-concierge:ci
          for i in $(seq 1 60); do
            if docker exec offline python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/ready', timeout=4)" 2> /dev/null; then
              echo "ready after ${i}s"; break
            fi
            if [ "$i" = 60 ]; then docker logs offline; exit 1; fi
            sleep 1
          done
          docker run --rm --network container:offline -v "$PWD/scripts:/scripts:ro" food-concierge:ci \
            python /scripts/smoke_deploy.py http://127.0.0.1:7860
      - name: Server logs
        if: always()
        run: |
          docker logs app 2>&1 | tail -50
          docker logs offline 2>&1 | tail -30 || true

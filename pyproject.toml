[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-food-concierge-mcp"
version = "0.1.0.dev0"
description = "Agentic multimodal menu concierge: LangGraph agent, MCP tools, hard dietary constraints, Langfuse LLMOps, zero-cost stack."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies for the API service (docs/planning/engineering-rules.md §1).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "openai>=1.50",
    "httpx>=0.27",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "Pillow>=10.4",
]

[project.optional-dependencies]
ingest = ["pandas>=2.2", "pyyaml>=6.0", "scipy>=1.13"]
ui = ["streamlit>=1.40", "httpx>=0.27"]
dev = [
    "multi-agent-food-concierge-mcp[ingest,ui]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls a real model provider; skipped unless selected with -m live",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["private"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]  # assert is idiomatic in pytest

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake credentials in tests

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

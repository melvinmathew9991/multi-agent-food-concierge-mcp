# Local checks that mirror CI's `secrets` and `test` jobs, so a problem shows up before the push.
# Install once: `uvx pre-commit install --hook-type pre-commit --hook-type pre-push`.
# ruff and mypy run from the project's venv, so their versions are the ones pinned in requirements-dev.lock.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]  # CI rejects tracked files over 5 MB
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      # Generated files (eval caches and results, test fixtures) keep the bytes their tools wrote.
      - id: end-of-file-fixer
        exclude: '\.(csv|jsonl|lock)$|^tests/fixtures/|^eval/(caches|results)/'
      - id: trailing-whitespace
        exclude: '\.(csv|jsonl|lock|md)$|^tests/fixtures/|^eval/(caches|results)/'

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, whole project)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]

  - {text: "allergy to fish", allergens: [fish]}
  - {text: "excluding milk", allergens: [milk]}
  - {text: "non-dairy latte", allergens: [milk]}
  - {text: "eggfree pancakes", allergens: [eggs]}

  # Diets
  - {text: "no meat please", diet: vegetarian}
  - {text: "I don't eat meat", diet: vegetarian}
  - {text: "meat-free dinner", diet: vegetarian}
  - {text: "meatless monday lunch", diet: vegetarian}
  - {text: "without meat", diet: vegetarian}
  - {text: "nothing with meat", diet: vegetarian}
  - {text: "veggie wrap", diet: vegetarian}
  - {text: "vegan, no soy", diet: vegan, allergens: [soy]}
  - {text: "strictly vegetarian", diet: vegetarian}
  - {text: "I'm vegan", diet: vegan}
  - {text: "not vegan, just want a curry"}
  - {text: "doesn't have to be vegetarian"}
  - {text: "no need for veg, I eat anything"}

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Push and pull-request runs scan only the new commits; these runs scan the full history.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        # Third-party action pinned to a commit (v2.3.9).
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Reject tracked files over 5 MB
        run: |
          large=$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 5 * 1024 * 1024')
          if [ -n "$large" ]; then echo "Files over 5 MB:"; echo "$large"; exit 1; fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install (locked, hash-checked)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lock files match pyproject.toml
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.11 --generate-hashes --no-header -q -o requirements.lock
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.11 --generate-hashes --no-header -q -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test (offline)
        run: pytest
      - name: Audit dependencies
        run: |
          pip-audit --require-hashes --disable-pip -r requirements.lock
          pip-audit --require-hashes --disable-pip -r requirements-dev.lock

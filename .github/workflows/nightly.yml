name: nightly

# Checks that need open-model downloads, which PR CI never does (engineering-rules.md §5.4).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install (locked, hash-checked)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Embedding model matches the committed reference
        # A fresh download every run, on purpose: the check exists to notice upstream model changes.
        run: pytest -m model_download
      - name: Build the catalog and indexes with the real embedder, then confirm a re-run does nothing
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: |
          python -m food_concierge.flows build
          python -m food_concierge.flows build | tee second-run.txt
          grep -q "^catalog: up to date" second-run.txt
          grep -q "^index: up to date" second-run.txt

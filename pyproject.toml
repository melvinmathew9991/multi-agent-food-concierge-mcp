[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-food-concierge-mcp"
dynamic = ["version"]
description = "Agentic multimodal menu concierge: LangGraph agent, MCP tools, hard dietary constraints, Langfuse LLMOps, zero-cost stack."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies for the API service (docs/planning/engineering-rules.md §1).
# SDKs with a history of breaking changes are capped below their next major (0.x: next minor);
# exact versions are pinned in requirements.lock / requirements-dev.lock (audit A19); regenerate both with
# the `uv pip compile` commands in .github/workflows/ci.yml after any change here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "openai>=1.50,<4",
    "httpx>=0.27",
    "httpx2>=2.12,<3",  # the HTTP client of openai>=3; the router injects it (timeouts, test transports)
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-aws>=1.0,<2",
    "langchain>=1.0,<2",  # Langfuse's LangChain callback imports it; LangGraph (Phase 5) comes with it
    "langfuse>=4.0,<5",
    "opentelemetry-api>=1.30,<2",  # trace_id in log lines; Langfuse v4 is built on it
    "fastembed>=0.8,<0.9",
    "faiss-cpu>=1.8",
    "qdrant-client>=1.12,<2",  # in-memory only: its on-disk local mode persists with pickle (rules §1)
    "rank-bm25>=0.2,<0.3",
    "numpy>=1.26,<3",
    "Pillow>=10.4",
]

[project.optional-dependencies]
ingest = ["pandas>=2.2", "pyyaml>=6.0", "scipy>=1.13", "prefect>=3.4,<4"]  # prefect: offline flows only
ui = ["streamlit>=1.40", "httpx>=0.27"]
dev = [
    "multi-agent-food-concierge-mcp[ingest,ui]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=1.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "uv>=0.12",
]

[tool.setuptools.dynamic]
version = { attr = "food_concierge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not model_download'"
asyncio_mode = "auto"
markers = [
    "live: calls a real model provider; skipped unless selected with -m live",
    "model_download: downloads an open model; run nightly with -m model_download, never in PR CI",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["private"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]  # assert is idiomatic in pytest

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # fake credentials; seeded random for property tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pyright]
venvPath = "."
venv = ".venv"

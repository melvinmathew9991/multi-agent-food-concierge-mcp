# Fixed prompts for the model profile (scripts/model_profile.py). Written for this project.
# 74 items: 10 constraint extractions and 32 routing decisions (structured output, role "router"),
# and 32 tool calls (role "chat"). Change only with a new profile run: results cite this file's hash.
#
# Splits (#51): `dev` may be run as often as needed; `test` is run once per model decision, after any
# prompt or model change has been settled on dev. Version 1's 20 items are all dev. Every route and every
# tool appears in test. Ambiguous and adversarial items (injection, typos, Hinglish, mixed intent) are in both.
#
# Expected values: a list means any of them is accepted (routing: only where the message is genuinely
# ambiguous); allergens are compared as sets. A tool item's expect may be a list of {name, args}, any of which is
# accepted, where two tools answer the message equally well.
# Tool arguments: `equals` (case-insensitive for text), `contains` (substring), `set` (same items).

version: 2

extraction:
  - id: ex01
    split: dev
    text: "Vegan dinner under 600 calories, no peanuts please"
    expect: {diet: vegan, max_calories: 600, budget_inr: null, exclude_allergens: [peanuts], courses: null}

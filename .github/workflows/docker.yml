name: docker

# Builds the server image, starts it and runs the deploy smoke test against it. Not on every PR: the build
# downloads the embedding model and about 380 MB of catalog photos from Wikimedia Commons.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.lock
      - requirements-dev.lock
      - scripts/smoke_deploy.py
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t food-concierge:ci .
      - name: Size
        run: docker image ls food-concierge:ci --format '{{.Size}}'
      - name: Start, with a throwaway agent token
        run: |
          token=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$token"
          echo "SMOKE_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name app -p 7860:7860 -e API_TOKEN_AGENT="$token" food-concierge:ci
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:7860/ready > /dev/null; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs app; exit 1
      - name: Smoke test (no model calls)
        # Runs in the image itself, so the runner needs no Python packages.
        run: |
          docker run --rm --network host -e SMOKE_TOKEN -v "$PWD/scripts:/scripts:ro" food-concierge:ci \
            python /scripts/smoke_deploy.py http://127.0.0.1:7860 --token-env SMOKE_TOKEN
      - name: Runs as non-root, offline model files
        run: |
          test "$(docker exec app id -u)" = "1000"
          docker exec app python -c "import os; assert os.environ['HF_HUB_OFFLINE'] == '1'"
      - name: Server log
        if: always()
        run: docker logs app 2>&1 | tail -50
